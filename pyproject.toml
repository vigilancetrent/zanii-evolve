[project]
name = "zanii-evolve"
version = "0.4.0"
description = "Regularized self-improvement of LLM agent harnesses: gains that hold up out of distribution, with verifiable change history"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "zaniiai agency" }]
keywords = ["llm", "agents", "agent-harness", "self-improvement", "evaluation",
            "prompt-optimization", "auditability", "proof-of-action"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # LLM roles call Claude through the Anthropic API or Vertex AI (providers.py);
    # OpenAI-compatible endpoints need no extra package
    "anthropic[vertex]>=0.40",
]

[project.optional-dependencies]
# The benchmark runners usually live in their own virtual environment (see
# ZANII_EVOLVE_AGENT_PYTHON in the README); these extras list what they import.
agentic = [
    # archipelago runner (Harvey LAB, EngDesign) and the MCP gateways
    "fastmcp>=2.0",
    "litellm>=1.50",
    "loguru>=0.7",
    "mcp>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "pymupdf>=1.24",
    "zaniidb-agent-memory>=0.11; python_version >= '3.11'",
]
coding = [
    # Terminal-Bench 2.1 / SWE-bench Verified through harbor
    "harbor>=0.18",
    "zaniidb-agent-memory>=0.11; python_version >= '3.11'",
]
# Zanii proof-of-action receipts on certificates (report / publish / verify-report),
# sealed keys, signed rulebooks, live-session receipts, data proofs, CV / SLA / escrow
provable = ["zanii>=0.25"]
# post-quantum dual signatures on certificates (identity --pq)
pq = ["zanii[pq]>=0.25"]
# one-line receipt hooks for agent frameworks (SessionRecorder)
langchain = ["zanii[langchain]>=0.25"]
openai-agents = ["zanii[openai-agents]>=0.25"]
crewai = ["zanii[crewai]>=0.25"]
# ZaniiDB backend for the harness memory lever (JSONL is used without it)
memory = ["zaniidb-agent-memory>=0.11; python_version >= '3.11'"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/vigilancetrent/zanii-evolve"
Source = "https://github.com/vigilancetrent/zanii-evolve"
Issues = "https://github.com/vigilancetrent/zanii-evolve/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zanii_evolve*"]

[tool.setuptools.package-data]
zanii_evolve = ["dashboard/*.html", "templates/**/*", "frameworks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
