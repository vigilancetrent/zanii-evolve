    <g fill="#64748B">
      <circle cx="40" cy="226" r="4"/><circle cx="100" cy="214" r="4"/><circle cx="150" cy="232" r="4"/>
      <circle cx="210" cy="190" r="4"/><circle cx="270" cy="198" r="4"/><circle cx="330" cy="150" r="4"/>
      <circle cx="390" cy="160" r="4"/><circle cx="450" cy="118" r="4"/>
    </g>
    <g fill="#2DD4BF">
      <circle cx="180" cy="160" r="7"/><circle cx="300" cy="118" r="7"/><circle cx="420" cy="82" r="7"/>
    </g>
    <rect x="0" y="62" width="480" height="40" fill="#2DD4BF" fill-opacity="0.07"/>
    <text x="482" y="58" text-anchor="end" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
