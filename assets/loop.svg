<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">The self-improving agent, with an auditor</title>
  <desc id="d">Seven steps in a loop. Zanii Blackbox records the agent's live runs. Runs that went wrong become incident and training tasks. Zanii Evolve searches for a certified gain. The regression gate checks held-out and incident tasks. A person approves. A staged rollout sends a canary share of sessions to the new harness. confirm-live signs whether the gain held up in production, and the loop starts again. Every step leaves a signed record.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lbl { font-size: 12px; font-weight: 600; fill: #64748B; letter-spacing: 1px; }
      .n { font-size: 12px; font-weight: 700; fill: #14B8A6; }
      .h { font-size: 14.5px; font-weight: 600; fill: #0F172A; }
      .s { font-size: 12px; fill: #475569; }
      .c { font-family: "JetBrains Mono", Consolas, Menlo, monospace; font-size: 11.5px; fill: #0F766E; font-weight: 600; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .hum { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.5; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#F8FAFC"/>
  <text x="30" y="46" class="lbl">EVERY WEEK, EVERY STEP SIGNED</text>

  <g transform="translate(30 70)"><rect width="150" height="130" rx="10" class="box"/>
    <text x="14" y="26" class="n">1</text><text x="14" y="50" class="h">Record</text>
    <text x="14" y="72" class="s">Blackbox keeps the</text><text x="14" y="88" class="s">agent's live runs</text>
    <text x="14" y="114" class="c">zanii-blackbox</text></g>
  <g transform="translate(195 70)"><rect width="150" height="130" rx="10" class="box"/>
    <text x="14" y="26" class="n">2</text><text x="14" y="50" class="h">Learn the misses</text>
    <text x="14" y="72" class="s">What went wrong</text><text x="14" y="88" class="s">becomes tasks</text>
    <text x="14" y="114" class="c">ingest-blackbox</text></g>
  <g transform="translate(360 70)"><rect width="150" height="130" rx="10" class="box"/>
    <text x="14" y="26" class="n">3</text><text x="14" y="50" class="h">Evolve</text>
    <text x="14" y="72" class="s">A gain that clears</text><text x="14" y="88" class="s">the noise, certified</text>
    <text x="14" y="114" class="c">watch · report</text></g>
  <g transform="translate(525 70)"><rect width="150" height="130" rx="10" class="box"/>
    <text x="14" y="26" class="n">4</text><text x="14" y="50" class="h">Gate</text>
    <text x="14" y="72" class="s">No regression on</text><text x="14" y="88" class="s">held-out, incidents</text>
    <text x="14" y="114" class="c">regress</text></g>
  <g transform="translate(690 70)"><rect width="150" height="130" rx="10" class="hum"/>
    <text x="14" y="26" class="n" fill="#D97706">5</text><text x="14" y="50" class="h">A person approves</text>
    <text x="14" y="72" class="s">Owner-signed, bound</text><text x="14" y="88" class="s">to this exact change</text>
    <text x="14" y="114" class="c">approve</text></g>
  <g transform="translate(855 70)"><rect width="150" height="130" rx="10" class="box"/>
    <text x="14" y="26" class="n">6</text><text x="14" y="50" class="h">Roll out</text>
    <text x="14" y="72" class="s">Canary share first;</text><text x="14" y="88" class="s">harm rolls it back</text>
    <text x="14" y="114" class="c">--rollout</text></g>
  <g transform="translate(1020 70)"><rect width="150" height="130" rx="10" class="box"/>
    <text x="14" y="26" class="n">7</text><text x="14" y="50" class="h">Confirm live</text>
    <text x="14" y="72" class="s">The gain held up in</text><text x="14" y="88" class="s">production, signed</text>
    <text x="14" y="114" class="c">confirm-live</text></g>

  <g stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M180 135H193"/><path d="M345 135H358"/><path d="M510 135H523"/>
    <path d="M675 135H688"/><path d="M840 135H853"/><path d="M1005 135H1018"/>
    <path d="M1095 200V250H105V204"/>
  </g>
  <text x="600" y="276" text-anchor="middle" class="s">next week starts from what production taught it · a regulator can replay every step from the signed records</text>
</svg>
