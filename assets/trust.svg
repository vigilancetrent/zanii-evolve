<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">What Zanii Evolve can prove</title>
  <desc id="d">Five layers of evidence built on the Zanii packages: sealed and post-quantum keys; certificates with public views; anchoring on the Zanii ledger; live session evidence; and client data and business artifacts. Each layer names what it proves.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 15px; font-weight: 600; fill: #0F172A; }
      .s { font-size: 12.5px; fill: #475569; }
      .p { font-size: 12.5px; fill: #0F766E; font-weight: 600; }
      .lbl { font-size: 12px; font-weight: 600; fill: #64748B; letter-spacing: 1px; }
      .row { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .tag { fill: #F0FDFA; stroke: #14B8A6; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="#F8FAFC"/>
  <text x="40" y="44" class="lbl">LAYER</text>
  <text x="410" y="44" class="lbl">BUILT ON</text>
  <text x="830" y="44" class="lbl">WHAT IT PROVES</text>

  <rect x="40" y="58" width="1120" height="58" rx="10" class="row"/>
  <text x="58" y="84" class="h">Keys</text><text x="58" y="103" class="s">sealed at rest, rotatable, post-quantum</text>
  <text x="410" y="92" class="s">kms · pq · succession · delegation</text>
  <text x="830" y="92" class="p">who signed, and that a stolen disk is not a stolen key</text>

  <rect x="40" y="126" width="1120" height="58" rx="10" class="row"/>
  <text x="58" y="152" class="h">Certificates</text><text x="58" y="171" class="s">digest, receipt, public view, rulebook, task manifest</text>
  <text x="410" y="160" class="s">receipt · redact · constitution · train</text>
  <text x="830" y="160" class="p">the gain is real, under these rules, on these tasks</text>

  <rect x="40" y="194" width="1120" height="58" rx="10" class="row"/>
  <text x="58" y="220" class="h">Ledger</text><text x="58" y="239" class="s">anchored receipts, watched for rewrites</text>
  <text x="410" y="228" class="s">client · monitor · ledger.zanii.agency</text>
  <text x="830" y="228" class="p">when it happened, and that history was not rewritten</text>

  <rect x="40" y="262" width="1120" height="58" rx="10" class="row"/>
  <text x="58" y="288" class="h">Live sessions</text><text x="58" y="307" class="s">signed actions, decisions, behaviour gate, memory</text>
  <text x="410" y="296" class="s">attest · decisions · sentinel · memory · connectors</text>
  <text x="830" y="296" class="p">which code served whom, and how it behaved</text>

  <rect x="40" y="330" width="1120" height="58" rx="10" class="row"/>
  <text x="58" y="356" class="h">Data and business</text><text x="58" y="375" class="s">deletion, CV, SLA, escrow, audit</text>
  <text x="410" y="364" class="s">retention · cv · sla · escrow · insurance · compliance</text>
  <text x="830" y="364" class="p">a client's data was deleted; pay only for proven gains</text>
</svg>
